<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Healthie userscript test harness</title>
    <style>
      body { font: 16px system-ui; max-width: 980px; margin: 24px auto; padding: 16px; }
      button { margin: 5px; padding: 8px; }
      #overview { border: 1px solid #aaa; padding: 16px; }
      #errors { color: #b00020; white-space: pre-wrap; }
      .columns { display: flex; }
      .column { width: 100%; }
      .mt-3 { margin-top: 12px; }
      svg { width: 16px; height: 16px; }
    </style>
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script src="/vendor/jquery.js"></script>
    <script>window.unsafeWindow = window;</script>
    <script src="/extension-api.js"></script>
    <script src="/userscript-under-test.js"></script>
    <script src="/harness.js" defer></script>
  </head>
  <body>
    <h1>Healthie userscript test harness</h1>
    <p>Local React fixture for the actual appointments and overlay functions in careplan.js.</p>
    <p>This page contains synthetic data. Automated tests replace Misha iframe responses.</p>
    <nav aria-label="Test actions">
      <button id="inject">Inject appointments</button>
      <button id="refresh">Refresh appointments</button>
      <button id="restore">Restore appointments</button>
      <button id="load">Load Overview</button>
      <button id="unmount">Unmount Overview</button>
      <button id="patient">Next patient</button>
    </nav>
    <p data-testid="status">Ready</p>
    <p>Native clicks: <span data-testid="native-clicks">0</span></p>
    <p>Escaped schedule clicks: <span data-testid="bubbled-clicks">0</span></p>
    <pre id="errors" data-testid="errors"></pre>
    <main id="overview"></main>
  </body>
</html>
